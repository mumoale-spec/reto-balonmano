</style><main><header><small>UNIVERSIDAD FRANCISCO DE VITORIA · CAFYD</small><h1>Reto Balonmano</h1>Entrena antes del examen</header><section id="game"></section><footer>Autoevaluación voluntaria · Sin registro de calificaciones</footer></main><script>
const bank=[{"n": 1, "q": "¿Cuántos jugadores conforman un equipo de balonmano en el campo de juego (incluido el portero)?", "opts": ["5 de campo más el portero", "7 de campo más el portero", "6 de campo más el portero", "8 de campo (incluido el portero)"], "correct": 2, "note": "El máximo simultáneo es de siete jugadores, incluido el portero."}, {"n": 2, "q": "El equipo atacante mantiene la posesión del balón realizando pases horizontales entre los jugadores de primera línea, sin penetraciones ni acciones claras hacia portería. El árbitro advierte de juego pasivo levantando el brazo. Tras dicha advertencia, el equipo atacante continúa circulando el balón sin generar una situación manifiesta de lanzamiento.", "opts": ["Tras la advertencia de juego pasivo, el equipo atacante puede realizar un número ilimitado de pases mientras conserve la posesión.", "Una vez advertido el juego pasivo, el árbitro debe detener inmediatamente el juego y conceder golpe franco al equipo defensor.", "Tras la advertencia de juego pasivo, el equipo atacante dispone de un máximo de 4 pases para finalizar la acción con lanzamiento a portería; de no hacerlo, se sancionará pasivo concediendo la posesión al equipo defensor.", "El juego pasivo solo puede sancionarse si el equipo atacante supera un tiempo determinado de posesión."], "correct": 2, "note": "Tras la señal de advertencia se aplica el límite general de cuatro pases."}, {"n": 3, "q": "¿Cuántos ciclos de pasos y ciclos de bote tenemos en balonmano para un jugador de campo?", "opts": ["Tres ciclos de pasos y un ciclo de bote.", "Dos ciclos de pasos y un ciclo de bote.", "Dos ciclos de pasos e ilimitados ciclos de bote.", "Tres ciclos de pasos e ilimitados ciclos de bote."], "correct": 1, "note": "Se permiten dos ciclos de pasos separados por un ciclo de bote."}, {"n": 4, "q": "Respecto a un gol en balonmano playa, marque la opción correcta.", "opts": ["Después de un gol se debe sacar del centro para reanudar el juego.", "El gol siempre vale doble cuando se realiza un lanzamiento en fly o colgada, giro o lanzamiento del portero.", "El gol puede valer de tres cuando el portero realiza un lanzamiento en giro.", "No existen goles que valen un solo tanto."], "correct": 1, "note": "Los goles espectaculares válidos y los del portero puntúan doble."}, {"n": 5, "q": "Respecto a faltas, conductas antideportivas y sus sanciones disciplinarias, marque la opción correcta.", "opts": ["No existe la ley de la ventaja en balonmano, ya que no se debe permitir la continuidad del juego, evitándola con un golpe franco.", "La sanción de descalificación (roja) sobre un jugador repercute en dos minutos fuera del campo, que no vuelva a participar en el propio partido y además no pueda jugar el siguiente.", "La descalificación con informe escrito (azul) corresponde a acciones premeditadas o malintencionadas que no están relacionadas de ninguna forma con el juego.", "La sanción de 2 minutos es para un balonazo en la cara del portero durante un lanzamiento de 7 m."], "correct": 3, "note": "La plantilla aplica la regla de exclusión de dos minutos; deben cumplirse las condiciones reglamentarias del impacto."}, {"n": 6, "q": "Respecto a faltas, conductas antideportivas y sus sanciones disciplinarias, marque la opción correcta.", "opts": ["En balonmano existe la progresividad de las sanciones, eso quiere decir que antes de obtener una descalificación (roja) debes pasar por sanciones de dos minutos y amonestaciones (amarilla).", "En balonmano no se permite utilizar los brazos flexionados para controlar al adversario y seguirle.", "La descalificación será para acciones como: el portero sale del área a cortar un contraataque y choca con el jugador (aunque consiga la posesión).", "Las acciones de descalificación (roja) suelen conllevar partidos de sanción en balonmano."], "correct": 2, "note": "El portero que sale del área para interceptar y provoca una colisión puede ser descalificado."}, {"n": 7, "q": "Durante una acción de contraataque, un jugador atacante recibe un empujón por detrás por parte de un defensor, pero consigue mantener el equilibrio y finalizar la acción con lanzamiento a portería, que acaba en gol. El árbitro aplica la ley de la ventaja. Tras el gol, el defensor protesta de forma reiterada y con gestos evidentes hacia el árbitro.", "opts": ["En total, el defensor será sancionado únicamente con dos minutos por el empujón, ya que el gol invalida cualquier otra sanción disciplinaria posterior.", "Se concede el gol por aplicación de la ley de la ventaja y, posteriormente, el defensor será sancionado con dos minutos por el empujón y dos minutos adicionales por las protestas reiteradas.", "El árbitro debe anular el gol y señalar golpe franco, sancionando al defensor con dos minutos por el empujón.", "El defensor será descalificado directamente con tarjeta roja por protestar tras la aplicación de la ley de la ventaja y, aunque será gol, habrá lanzamiento de penalti."], "correct": 1, "note": "En el supuesto planteado se mantiene el gol y se acumulan las sanciones disciplinarias."}, {"n": 8, "q": "Respecto a los bloqueos frontales y/o pantallas, marque la opción correcta.", "opts": ["Se suelen utilizar para pasar al pivote, permitiendo que este se gire y pueda lanzar.", "Se suelen utilizar por parte del pivote para que los jugadores de segunda línea realicen un lanzamiento en profundidad.", "Se suelen utilizar por parte del pivote para que los jugadores de primera línea realicen un lanzamiento en suspensión.", "Se suelen utilizar en acciones donde lo que se busca es el pase al pivote y no favorecer el pase al compañero."], "correct": 2, "note": "La pantalla facilita el lanzamiento de los jugadores de primera línea."}, {"n": 9, "q": "Respecto a los elementos técnico-tácticos ofensivos y defensivos, marque la opción correcta.", "opts": ["Las acciones de penetraciones sucesivas son propicias para primeras etapas, ya que tratan de ver la búsqueda de espacios.", "Las acciones de cruces y permutas son propicias para primeras etapas, ya que tratan de trabajar la búsqueda de espacios.", "Las acciones de pase y va son propicias para primeras etapas, ya que tratan de trabajar la búsqueda de espacios.", "Las acciones de cortinas son las propicias para primeras etapas, ya que tratan de trabajar la búsqueda de espacios."], "correct": 2, "note": "El pase y va permite introducir la búsqueda de espacios y la continuidad tras el pase."}, {"n": 10, "q": "Durante una acción ofensiva, un jugador atacante es sujetado levemente por un defensor cuando se encuentra a 8 metros de la portería. El árbitro sanciona la acción como falta defensiva y concede golpe franco al equipo atacante.", "opts": ["El golpe franco debe ejecutarse desde la línea de 9 metros y los defensores deben situarse a 2 metros del balón.", "En el golpe franco, el jugador atacante debe pasar obligatoriamente el balón a un compañero antes de poder lanzar a portería.", "Al producirse la falta dentro de los 9 metros, la sanción correcta es siempre lanzamiento de 7 metros.", "El golpe franco se ejecuta desde el lugar de la falta o, si se produce entre 6 y 9 m, desde la línea de 9 m en el punto más cercano, y los defensores deben situarse a 3 m."], "correct": 3, "note": "La ejecución se desplaza a la línea de golpe franco cuando la falta ocurre dentro de ella."}, {"n": 11, "q": "Respecto al reglamento, marque la opción correcta.", "opts": ["El campo de balonmano mide 30 × 20 m.", "Hay 3 tiempos muertos y un máximo de 2 por periodo.", "En la liga profesional de balonmano no existen los empates, siempre debe haber un ganador.", "Después de un gol siempre se saca de portería para reactivar el juego, no existe el saque de centro."], "correct": 1, "note": "En el sistema de tres tiempos muertos, el máximo por periodo es dos."}, {"n": 12, "q": "Respecto al artículo de García-Sánchez, C., Navarro, R. M., Karcher, C., & de la Rubia, A. (2023). Physical Demands during Official Competitions in Elite Handball: A Systematic Review, marque la opción correcta.", "opts": ["Los jugadores masculinos realizan más distancia recorrida que las jugadoras femeninas durante un partido de balonmano.", "Los jugadores internacionales realizan más distancia recorrida que los jugadores nacionales durante un partido de balonmano.", "Las jugadoras femeninas realizan más distancia recorrida que los jugadores masculinos durante un partido de balonmano.", "Los jugadores nacionales realizan menos distancia recorrida que los jugadores internacionales durante un partido de balonmano."], "correct": 2, "note": "Según la corrección del examen, las jugadoras recorren mayor distancia."}, {"n": 13, "q": "Respecto al pase en pronación en balonmano, marque la opción correcta.", "opts": ["Sirve para realizar un pase al pivote.", "Se suele dar para realizar pases largos.", "Se suele realizar para realizar pases en proximidad buscando la velocidad.", "Se suele utilizar para acciones de desdoblamientos."], "correct": 2, "note": "La pronación facilita pases rápidos a corta distancia."}, {"n": 14, "q": "Respecto a la disuasión, marque la respuesta correcta.", "opts": ["Supone evitar la participación del atacante en el momento en el que desea intervenir, retrasar esta intervención u obligarle a realizar intervenciones en espacios no deseados.", "Supone evitar la participación del atacante en el momento en el que desea intervenir, robar el balón y retrasar esta intervención u obligarle a realizar intervenciones en espacios no deseados.", "Consiste en desplazarse un jugador con o sin balón, hacia la segunda o primera línea ofensiva desde cualquiera de las posiciones ofensivas.", "Responde a la acción de trasladarse de un lugar a otro por el terreno de juego sin estar en posesión del balón, tanto dentro como fuera del puesto específico."], "correct": 0, "note": "La disuasión condiciona la intervención del atacante sin exigir recuperar el balón."}, {"n": 15, "q": "Respecto al tipo de defensa en balonmano, marque la respuesta correcta.", "opts": ["Es fundamental proporcionar defensas pasivas en primeras etapas esperando los errores del equipo atacante.", "Proporcionar defensas activas en primeras etapas de formación es interesante para motivar las recuperaciones e interceptaciones.", "Mostrar sistemas defensivos en primeras etapas como 5:1, 3:2:1 y 6:0 es interesante para interiorizar los puestos específicos.", "Proporcionar defensas pasivas en primeras etapas de formación es interesante para motivar las recuperaciones e interceptaciones."], "correct": 1, "note": "Las defensas activas favorecen la recuperación y la interceptación."}, {"n": 16, "q": "Respecto a la acción que estás viendo, marque la opción correcta.", "opts": ["Se representa un pasivo.", "Se representa un pase y va.", "Se representa un desdoblamiento.", "Se representa una defensa mixta."], "correct": 1, "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAdYAAAG7CAYAAAB+cLTeAACk0klEQVR4nOz9d3zddd3/j9/Pnlkne++0TfduKbTsDYooIrgv1yUXF16iH78qAoI44OcWBVEEByiyBAQBgVJaaKF7pWnSdCVN0ux99vn9cXy9+87pSWnTNPN5v91yS3LG+7zOej9ez22IRCIRBEEQBEEYEYxjvQBBEARBmEyYT3Sl3pgVw1YQBEEQBmMwGI77e5Cw9vb2cujQISKRyHFCKsIqCIIgCMfIz8/H7XZrgmowGDAYDIOFdd26dVx66aVjskBBEARBmEg89dRTXHrppRiNxkE/g4RVrFJBEARBODm8Xi99fX2YzebBP/obibAKgiAIwsnR29tLV1cXVqsVm82G3W4HdDFWEVVBEARBOHl6enro6OjAbrfjcrkwGAzv7wp2uVw8+eST5OXlHXdAddtwOAyAyWTSLjMYDFoCVDAYJBKJYLVatcuF0UefuaZHvR+xCWv626v32Gg0DnksdZm8vxOHUCgERL+7gUCAQCCA1Wpl+/bt3H///XR3d+P3+1m2bBlJSUk4nc4zuh6j0Yjf72f9+vXs2rXrjH6WDAYD4XCYSCTC4sWLWbp0KRaLhUgkQigUOu5cFgwGByWoDOfxDAYDJpMJiLoQt23bxvr167XHMhqN2olZfedOB3WcSCSiHc9ms3HOOecwbdo0rFbroOtP9fVWa1XPTZ3r9Y8HUF1dzVtvvUU4HB7WazdcFi5cyMKFCwdp0+nQ09PDn//8ZwYGBrTLent76ezs1ETVYrFgsViiwjrUgxoMBioqKigpKRl0eSgU0l5E/YdQf6zYE+1ovqDCMU70+g8lpCe63cncXpgYBAIBTCaTtmFS73N7ezvp6el4vV46OzvZuHHjoBPnmSYcDuPxeM64sPr9fjo6OtizZw/t7e14vd7jnqPFYsFoNBKJRPD5fPj9fux2+7BO1gaDQXMZ2mw2jh49SiQSwel0YrVatfdCCRUcv+E9GfTvpxK5cDjMwMAAfr+fmpoaWlpa8Pl8eL1e/H7/KR1foY5rMpkwGAz09/djsVhwOp2EQiGMRiNut5v+/n4cDgdms1lL7jnTGA
